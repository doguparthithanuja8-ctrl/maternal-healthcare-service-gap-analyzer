# ==============================================================================
# Spring Boot Configuration: Maternal Healthcare Analyzer
# ==============================================================================

spring.application.name=maternal-health-analyzer
server.port=8080

# ------------------------------------------------------------------------------
# Database Configuration (MySQL / H2 fallback for testing)
# Replace with environment variables in production
# ------------------------------------------------------------------------------
# MySQL Profile Configuration:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maternal_health_analyzer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# CORS Configuration (Vite dev server default: port 3000 / 5173)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# Actuator / Logging
logging.level.com.maternalhealth.analyzer=INFO
logging.level.org.springframework.web=WARN
